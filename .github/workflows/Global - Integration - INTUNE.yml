name: Global - Integration - INTUNE
on:
  push:
    branches:
      - Dev

jobs:
  Integration-Global-INTUNE:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    steps:
      - uses: actions/checkout@v7

      - name: Install Modules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name "Microsoft.PowerShell.PSResourceGet" -Repository "PSGallery" -Scope "AllUsers" -Force -SkipPublisherCheck
          $dependencies = (Import-PowerShellDataFile ./Modules/Microsoft365DSC/Dependencies/Manifest.psd1).Dependencies

          foreach ($name in @('M365DSC.PSDesiredStateConfiguration', 'DSCParser'))
          {
            $dependency = $dependencies | Where-Object ModuleName -EQ $name
            if ($null -eq $dependency) {
                throw "$name is missing from Dependencies/Manifest.psd1."
            }
            Install-PSResource -Name $dependency.ModuleName -Version $dependency.RequiredVersion -Scope AllUsers -TrustRepository
          }

          Install-PSResource -Name ReverseDSC -Scope AllUsers -TrustRepository
          [System.Environment]::SetEnvironmentVariable('M365DSCTelemetryEnabled', $false, [System.EnvironmentVariableTarget]::Machine);

      - name: Build Class Modules
        shell: pwsh
        run: |
          & ./Utilities/Build-Microsoft365DSC.ps1

      - name: Build Dll Files
        shell: pwsh
        run: |
          & ./Utilities/Build-DllFiles.ps1 -Configuration Release

      - name: Copy Microsoft365DSC
        shell: powershell
        run: |
          winrm quickconfig -force
          $source = "./Modules/Microsoft365DSC/"
          $destination = "C:\Program Files\WindowsPowerShell\Modules"
          Copy-Item -Path $source -Recurse -Destination $destination -Container -Force
          Update-M365DSCDependencies

      - name: Configure Environment
        shell: powershell
        run: |
          Set-ExecutionPolicy Unrestricted -Force
          Get-ChildItem "C:\Program Files\WindowsPowerShell\Modules" -Recurse | Unblock-File
          Set-M365DSCTelemetryOption -Enabled $false
          Set-Item -Path WSMan:\localhost\MaxEnvelopeSizekb -Value 1000000

      - name: Generate {Create} Integration Tests from Examples
        shell: powershell
        run: |
          Import-Module './Tests/Integration/M365DSCTestEngine.psm1'
          New-M365DSCIntegrationTest -Workload INTUNE -Step '1-Create'

      - name: Generate {Update} Integration Tests from Examples
        shell: powershell
        run: |
          Import-Module './Tests/Integration/M365DSCTestEngine.psm1'
          New-M365DSCIntegrationTest -Workload INTUNE -Step '2-Update'

      - name: Generate {Remove} Integration Tests from Examples
        shell: powershell
        run: |
          Import-Module './Tests/Integration/M365DSCTestEngine.psm1'
          New-M365DSCIntegrationTest -Workload INTUNE -Step '3-Remove'

      - name: Check Integration Test Certificate
        shell: powershell
        run: |
          $thumbprint = '${{ secrets.RUNNERCERTIFICATETHUMBPRINT }}'
          if ([System.String]::IsNullOrWhiteSpace($thumbprint) -or -not (Test-Path -Path "Cert:\LocalMachine\My\$thumbprint"))
          {
            Write-Warning 'Skipping integration test execution because the configured runner certificate is not installed.'
            'M365DSC_RUN_INTEGRATION_TESTS=false' | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else
          {
            'M365DSC_RUN_INTEGRATION_TESTS=true' | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Execute {Create} Integration Tests
        if: env.M365DSC_RUN_INTEGRATION_TESTS == 'true'
        shell: powershell
        run: |
            .\Tests\Integration\Microsoft365DSC\M365DSCIntegration.INTUNE.Create.Tests.ps1 -ApplicationID ${{ secrets.RUNNERAPPID }} -TenantId ${{ secrets.RUNNERTENANTID }} -CertificateThumbprint ${{ secrets.RUNNERCERTIFICATETHUMBPRINT }}
