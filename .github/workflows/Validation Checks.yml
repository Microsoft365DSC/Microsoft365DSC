name: Validation Checks
on: pull_request

jobs:
  # This workflow contains a single job called "build"
  UnitTests:
    # The type of runner that the job will run on
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Ensure No MOF Schema Files Remain
        shell: pwsh
        run: |
          $schemaFiles = @(Get-ChildItem './Modules/Microsoft365DSC/DscResources' -Filter '*.schema.mof' -File -Recurse)

          if ($schemaFiles.Count -gt 0)
          {
            $names = ($schemaFiles.Name -join ', ')
            throw "Class-based resources do not ship a MOF schema. Remove: $names"
          }

      - name: Ensure Every Resource Is Class-Based
        shell: pwsh
        run: |
          $resources = Get-ChildItem './Modules/Microsoft365DSC/DscResources' -Filter 'MSFT_*.psm1' -File -Recurse

          foreach ($resource in $resources)
          {
            $content = Get-Content $resource.FullName -Raw
            if ($content -notmatch '(?m)^\s*\[DscResource\(\)\]')
            {
              throw "Resource {$($resource.Name)} does not declare a [DscResource()] class."
            }
            if ($content -match '(?m)^\s*function\s+(Get|Set|Test|Export)-TargetResource\b')
            {
              throw "Resource {$($resource.Name)} still declares *-TargetResource functions. Use class methods instead."
            }
          }

      - name: Ensure No Hardcoded Graph Endpoints
        shell: pwsh
        run: |
          $resources = Get-ChildItem './Modules/Microsoft365DSC/DscResources/*.psm1' -Recurse

          foreach ($resource in $resources)
          {
            $content = Get-Content $resource.FullName -Raw
            $foundPosition = $content.IndexOf('https://graph.microsoft.com', 0)
            if ($foundPosition -ge 0)
            {
              throw "Resource {$($Resource.Name)} contains hardcoded Graph references."
            }
          }

      - name: Ensure resource names are not too long
        shell: pwsh
        run: |
          $root = (Resolve-Path './Modules/Microsoft365DSC/DscResources').Path
          $fixedLength = 107 # Usually between 100-105, taking a bit more

          foreach ($file in (Get-ChildItem -Path $root -Recurse -File))
          {
            $relativePath = $file.FullName.Substring($root.Length + 1)
            if ($relativePath.Length + $fixedLength -gt 255)
            {
              throw "Resource file {$relativePath} has a name that leads to import errors because the path is too long."
            }
          }

      - name: Ensure No Hardcoded Azure Endpoints
        shell: pwsh
        run: |
          $resources = Get-ChildItem './Modules/Microsoft365DSC/DscResources/*.psm1' -Recurse

          foreach ($resource in $resources)
          {
            $content = Get-Content $resource.FullName -Raw
            $foundPosition = $content.IndexOf('https://management.azure.com', 0)
            if ($foundPosition -ge 0)
            {
              throw "Resource {$($Resource.Name)} contains hardcoded Azure references."
            }
          }
