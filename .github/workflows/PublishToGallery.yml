name: Publish to PowerShell Gallery

on:
  push:
    branches:
      - Master

jobs:
  PublishToGallery:
    runs-on: windows-latest

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    steps:
      - uses: actions/checkout@v7

      - name: Install Modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencies = (Import-PowerShellDataFile ./Modules/Microsoft365DSC/Dependencies/Manifest.psd1).Dependencies

          foreach ($name in @('M365DSC.PSDesiredStateConfiguration', 'DSCParser'))
          {
            $dependency = $dependencies | Where-Object ModuleName -EQ $name
            if ($null -eq $dependency) {
                throw "$name is missing from Dependencies/Manifest.psd1."
            }
            Install-PSResource -Name $dependency.ModuleName -Version $dependency.RequiredVersion -Scope AllUsers -TrustRepository
          }

          # New-M365DSCAdaptedResourceManifest.ps1 requires 0.3.0 or later, which is not on the
          # gallery yet. Until it is, a missing tool only skips the manifests.
          try
          {
              Install-PSResource -Name DscResource.Authoring -Scope AllUsers -TrustRepository -ErrorAction Stop
          }
          catch
          {
              Write-Warning -Message "DscResource.Authoring could not be installed, so the adapted resource manifests are skipped: $($_.Exception.Message)"
          }

      - name: Build Class Modules
        shell: pwsh
        run: |
          & ./Utilities/Build-Microsoft365DSC.ps1 -SkipSchemaCache -SkipAdaptedManifests

      - name: Build Dll Files
        shell: pwsh
        run: |
          & ./Utilities/Build-DllFiles.ps1 -Configuration Release

      - name: Generate Adapted Resource Manifests
        shell: pwsh
        run: |
          & ./Utilities/New-M365DSCAdaptedResourceManifest.ps1 -WarnOnly

      - name: Trim Build-Only Sources
        shell: pwsh
        run: |
          & ./Utilities/Remove-M365DSCBuildOnlySource.ps1 -Confirm:$false

      - name: Generate Schema Cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencies = (Import-PowerShellDataFile ./Modules/Microsoft365DSC/Dependencies/Manifest.psd1).Dependencies
          $engine = $dependencies | Where-Object ModuleName -EQ 'M365DSC.PSDesiredStateConfiguration'
          if ($null -eq $engine) {
              throw 'M365DSC.PSDesiredStateConfiguration is missing from Dependencies/Manifest.psd1.'
          }
          Install-PSResource -Name $engine.ModuleName -Version $engine.RequiredVersion -Scope AllUsers -Reinstall -TrustRepository
          & ./Utilities/New-M365DSCDscSchemaCache.ps1

      - name: Publish
        shell: powershell
        env:
          PUBLIC_NUGETAPIKEY: ${{ secrets.NugetAPIKey }}
        run: |
          Publish-Module -Path "./Modules/Microsoft365DSC/" -NugetAPIKey $env:PUBLIC_NUGETAPIKEY
