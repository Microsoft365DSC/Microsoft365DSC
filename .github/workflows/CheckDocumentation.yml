name: Check Documentation on PR
on:
  pull_request:
    branches:
      - Master
      - Dev

jobs:
  CheckDocs:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencies = (Import-PowerShellDataFile ./Modules/Microsoft365DSC/Dependencies/Manifest.psd1).Dependencies

          foreach ($name in @('M365DSC.PSDesiredStateConfiguration', 'DSCParser'))
          {
            $dependency = $dependencies | Where-Object ModuleName -EQ $name
            if ($null -eq $dependency) {
                throw "$name is missing from Dependencies/Manifest.psd1."
            }
            Install-PSResource -Name $dependency.ModuleName -Version $dependency.RequiredVersion -Scope AllUsers -TrustRepository
          }

      - name: Build Class Modules
        shell: pwsh
        run: |
          & ./Utilities/Build-Microsoft365DSC.ps1 -SkipSchemaCache

      - name: Build Dll Files
        shell: pwsh
        run: |
          & ./Utilities/Build-DllFiles.ps1 -Configuration Release

      - name: Import Module & Generate Documentation
        shell: pwsh
        run: |
          Import-Module -Name "./Modules/Microsoft365DSC/Microsoft365DSC.psd1"
          Update-M365DSCResourceDocumentationPage -SourcePath ./Modules/Microsoft365DSC
          New-M365DSCCmdletDocumentation

      - name: Upload documentation for mdl check
        uses: actions/upload-artifact@v7
        with:
          name: generated-docs
          path: ./docs

  CheckMarkdownLint:
    needs: CheckDocs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download generated docs
        uses: actions/download-artifact@v8
        with:
          name: generated-docs
          path: ./docs

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install mdl
        run: gem install mdl

      - name: Run mdl on documentation
        continue-on-error: true
        run: |
          echo "Running markdownlint on documentation files..."
          mdl ./docs --style ./.mdlrc || true
          echo "Markdown lint check completed. See output above for any issues."
