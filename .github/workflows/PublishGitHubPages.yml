name: Generate Resources & Deploy GitHub Pages
on:
  push:
    branches:
      - Master
      - Dev

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  GenerateResource:
    runs-on: windows-latest

    # Only run in main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    steps:
      - uses: actions/checkout@v7

      - name: Install Modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencies = (Import-PowerShellDataFile ./Modules/Microsoft365DSC/Dependencies/Manifest.psd1).Dependencies

          foreach ($name in @('M365DSC.PSDesiredStateConfiguration', 'DSCParser'))
          {
            $dependency = $dependencies | Where-Object ModuleName -EQ $name
            if ($null -eq $dependency) {
                throw "$name is missing from Dependencies/Manifest.psd1."
            }
            Install-PSResource -Name $dependency.ModuleName -Version $dependency.RequiredVersion -Scope AllUsers -TrustRepository
          }

      - name: Build Class Modules
        shell: pwsh
        run: |
          & ./Utilities/Build-Microsoft365DSC.ps1 -SkipSchemaCache

      - name: Build Dll Files
        shell: pwsh
        run: |
          & ./Utilities/Build-DllFiles.ps1 -Configuration Release

      - name: Import Module & Generate Documentation
        shell: pwsh
        run: |
          Import-Module -Name "./Modules/Microsoft365DSC/Microsoft365DSC.psd1"
          Update-M365DSCResourceDocumentationPage -SourcePath ./Modules/Microsoft365DSC
          New-M365DSCCmdletDocumentation

      - name: Upload documentation as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-generation
          path: ./docs  # the folder containing the mkdocs.yml and generated docs

  deploy:
    needs: GenerateResource
    runs-on: ubuntu-latest

    # Only run in main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - run: |
          pip install mkdocs-material
          pip install mkdocs-include-dir-to-nav
          pip install mkdocs-rss-plugin

      - name: Download generated docs
        uses: actions/download-artifact@v8
        with:
          name: docs-generation
          path: ./docs

      - name: Build site
        working-directory: ./docs
        run: mkdocs build --site-dir ../site

      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
