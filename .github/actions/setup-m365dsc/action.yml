name: Setup Microsoft365DSC
description: Installs the test dependencies, builds the module and registers it for the test harness.

runs:
  using: composite
  steps:
    - name: Install Modules
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $dependencies = (Import-PowerShellDataFile ./Modules/Microsoft365DSC/Dependencies/Manifest.psd1).Dependencies

        foreach ($name in @('M365DSC.PSDesiredStateConfiguration', 'DSCParser'))
        {
          $dependency = $dependencies | Where-Object ModuleName -EQ $name
          if ($null -eq $dependency) {
              throw "$name is missing from Dependencies/Manifest.psd1."
          }
          Install-PSResource -Name $dependency.ModuleName -Version $dependency.RequiredVersion -Scope AllUsers -TrustRepository
        }

        Install-PSResource -Name ReverseDSC -Scope AllUsers -TrustRepository
        Install-PSResource -Name Pester -Scope AllUsers -TrustRepository -Version 6.2.0
        # New-M365DSCAdaptedResourceManifest.ps1 requires 0.3.0 or later, which is not on the
        # gallery yet. Until it is, a missing tool only skips the manifests.
        try
        {
            Install-PSResource -Name DscResource.Authoring -Scope AllUsers -TrustRepository -ErrorAction Stop
        }
        catch
        {
            Write-Warning -Message "DscResource.Authoring could not be installed, so the adapted resource manifests are skipped: $($_.Exception.Message)"
        }
        [System.Environment]::SetEnvironmentVariable('M365DSCTelemetryEnabled', $false, [System.EnvironmentVariableTarget]::Machine);

    - name: Build Class Modules
      shell: pwsh
      run: |
        & ./Utilities/Build-Microsoft365DSC.ps1 -SkipSchemaCache

    - name: Build Dll Files
      shell: pwsh
      run: |
        & ./Utilities/Build-DllFiles.ps1 -Configuration Release -SkipClean

    - name: Generate Schema Cache
      shell: pwsh
      run: |
        & ./Utilities/New-M365DSCDscSchemaCache.ps1

    - name: Register Module
      shell: pwsh
      run: |
        New-Item -Type SymbolicLink -Path "C:\Program Files\WindowsPowerShell\Modules\Microsoft365DSC" -Target (Join-Path -Path . -ChildPath 'Modules/Microsoft365DSC' -Resolve)
